<!DOCTYPE html>
<html>
<head>
    <title>用户认证测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>用户认证测试</h1>
    
    <div class="test-section">
        <h2>1. 检查本地存储</h2>
        <button onclick="checkLocalStorage()">检查 localStorage</button>
        <button onclick="clearLocalStorage()">清除 localStorage</button>
        <div id="localStorageResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 测试注册</h2>
        <div>
            <input type="text" id="username" placeholder="用户名" value="testuser">
            <input type="email" id="email" placeholder="邮箱" value="test@example.com">
            <input type="password" id="password" placeholder="密码" value="123456">
            <button onclick="testRegister()">测试注册</button>
        </div>
        <div id="registerResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. 测试登录</h2>
        <div>
            <input type="text" id="loginUsername" placeholder="用户名" value="testuser">
            <input type="password" id="loginPassword" placeholder="密码" value="123456">
            <button onclick="testLogin()">测试登录</button>
        </div>
        <div id="loginResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>4. 检查登录状态</h2>
        <button onclick="checkLoginStatus()">检查登录状态</button>
        <button onclick="testLogout()">测试登出</button>
        <div id="statusResult" class="result"></div>
    </div>
    
    <script>
        function checkLocalStorage() {
            const userInfo = localStorage.getItem('userInfo');
            const userId = localStorage.getItem('userId');
            const registeredUsers = localStorage.getItem('registeredUsers');
            
            const result = document.getElementById('localStorageResult');
            result.innerHTML = `
                userInfo: ${userInfo ? JSON.stringify(JSON.parse(userInfo), null, 2) : 'null'}
                \nuserId: ${userId || 'null'}
                \nregisteredUsers: ${registeredUsers ? JSON.stringify(JSON.parse(registeredUsers), null, 2) : 'null'}
            `;
        }
        
        function clearLocalStorage() {
            localStorage.removeItem('userInfo');
            localStorage.removeItem('userId');
            localStorage.removeItem('registeredUsers');
            document.getElementById('localStorageResult').innerHTML = 'localStorage 已清除';
        }
        
        async function testRegister() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const result = document.getElementById('registerResult');
            result.innerHTML = '注册中...';
            
            try {
                // 模拟调用云函数
                const response = await fetch('/api/cloud-function/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'register',
                        username,
                        email,
                        password,
                        nickname: username
                    })
                });
                
                const data = await response.json();
                result.innerHTML = JSON.stringify(data, null, 2);
            } catch (error) {
                result.innerHTML = `注册失败: ${error.message}`;
            }
        }
        
        async function testLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            const result = document.getElementById('loginResult');
            result.innerHTML = '登录中...';
            
            try {
                // 模拟调用云函数
                const response = await fetch('/api/cloud-function/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'login',
                        username,
                        password
                    })
                });
                
                const data = await response.json();
                result.innerHTML = JSON.stringify(data, null, 2);
                
                // 如果登录成功，保存到 localStorage
                if (data.code === 200) {
                    localStorage.setItem('userInfo', JSON.stringify(data.data));
                    localStorage.setItem('userId', data.data.userId);
                }
            } catch (error) {
                result.innerHTML = `登录失败: ${error.message}`;
            }
        }
        
        function checkLoginStatus() {
            const userInfo = localStorage.getItem('userInfo');
            const userId = localStorage.getItem('userId');
            
            const result = document.getElementById('statusResult');
            result.innerHTML = `
                登录状态: ${userInfo && userId ? '已登录' : '未登录'}
                \n用户ID: ${userId || 'null'}
                \n用户信息: ${userInfo ? JSON.stringify(JSON.parse(userInfo), null, 2) : 'null'}
            `;
        }
        
        async function testLogout() {
            try {
                // 模拟调用云函数
                await fetch('/api/cloud-function/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'logout'
                    })
                });
            } catch (error) {
                // 忽略登出请求失败
            }
            
            localStorage.removeItem('userInfo');
            localStorage.removeItem('userId');
            document.getElementById('statusResult').innerHTML = '已登出';
        }
    </script>
</body>
</html>
